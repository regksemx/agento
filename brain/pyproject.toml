[project]
name = "agento-brain"
version = "0.1.0"
description = "agento brain: local System-1 router daemon (ONNX student / rules fallback) on a unix socket"
requires-python = ">=3.11"
dependencies = [
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.16"]

[project.scripts]
agento-brain = "agento_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agento_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
