<svg xmlns="http://www.w3.org/2000/svg" width="754" height="270" viewBox="0 32 754 270">


<g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
<text x="40.8" y="52" fill="#d97757" textLength="159.6" lengthAdjust="spacingAndGlyphs" font-weight="700" xml:space="preserve">Переключение модели</text>
<text x="208.8" y="52" fill="#8b8680" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">────────────────────────────────────────────────────────────</text>
<text x="40.8" y="70" fill="#8b8680" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Что стоило бы переключение модели посреди задачи.</text>
<text x="57.6" y="106" fill="#8b8680" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">переход</text>
<text x="435.6" y="106" fill="#8b8680" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">префикс</text>
<text x="511.2" y="106" fill="#8b8680" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">штраф</text>
<text x="578.4" y="106" fill="#8b8680" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">за шаг</text>
<text x="645.6" y="106" fill="#8b8680" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">окупится</text>
<text x="57.6" y="124" fill="#8b8680" textLength="655.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="57.6" y="142" fill="#f0eee6" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">opus-5.5 → sonnet-5.5</text>
<text x="460.8" y="142" fill="#8b8680" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">100k</text>
<text x="511.2" y="142" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.23</text>
<text x="570.0" y="142" fill="#7fb685" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+$0.022</text>
<text x="645.6" y="142" fill="#f0eee6" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">11 шагов</text>
<text x="57.6" y="160" fill="#f0eee6" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">opus-5.5 → haiku-4.5</text>
<text x="460.8" y="160" fill="#8b8680" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">100k</text>
<text x="511.2" y="160" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.11</text>
<text x="570.0" y="160" fill="#7fb685" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+$0.031</text>
<text x="662.4" y="160" fill="#f0eee6" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4 шага</text>
<text x="57.6" y="178" fill="#f0eee6" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sonnet-5.5 → opus-5.5</text>
<text x="469.2" y="178" fill="#8b8680" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">60k</text>
<text x="511.2" y="178" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.15</text>
<text x="570.0" y="178" fill="#c85a54" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">−$0.022</text>
<text x="654.0" y="178" fill="#8b8680" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">никогда</text>
<text x="57.6" y="196" fill="#f0eee6" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">opus-5.5 → opus-5</text>
<text x="469.2" y="196" fill="#8b8680" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">60k</text>
<text x="511.2" y="196" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.36</text>
<text x="570.0" y="196" fill="#c85a54" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">−$0.010</text>
<text x="654.0" y="196" fill="#8b8680" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">никогда</text>
<text x="57.6" y="232" fill="#8b8680" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⎿ </text>
<text x="74.4" y="232" fill="#8b8680" textLength="638.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agento не меняет модель посреди задачи: кэш не переносится, штраф это полная</text>
<text x="74.4" y="250" fill="#8b8680" textLength="613.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">перезапись префикса. Модель выбирается на старте задачи, после /clear и в</text>
<text x="74.4" y="268" fill="#8b8680" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">субагентах.</text>
</g>
</svg>
