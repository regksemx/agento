<svg xmlns="http://www.w3.org/2000/svg" width="754" height="270" viewBox="0 32 754 270">


<g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
<text x="40.8" y="52" fill="#d97757" textLength="100.8" lengthAdjust="spacingAndGlyphs" font-weight="700" xml:space="preserve">Model switch</text>
<text x="150.0" y="52" fill="#8b8680" textLength="562.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">───────────────────────────────────────────────────────────────────</text>
<text x="40.8" y="70" fill="#8b8680" textLength="420.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What switching the model mid-task would have cost.</text>
<text x="57.6" y="106" fill="#8b8680" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">switch</text>
<text x="393.6" y="106" fill="#8b8680" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">prefix</text>
<text x="460.8" y="106" fill="#8b8680" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">penalty</text>
<text x="536.4" y="106" fill="#8b8680" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">gain/step</text>
<text x="628.8" y="106" fill="#8b8680" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">break-even</text>
<text x="57.6" y="124" fill="#8b8680" textLength="655.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="57.6" y="142" fill="#f0eee6" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">opus-5.5 → sonnet-5.5</text>
<text x="410.4" y="142" fill="#8b8680" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">100k</text>
<text x="477.6" y="142" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.23</text>
<text x="553.2" y="142" fill="#7fb685" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+$0.022</text>
<text x="645.6" y="142" fill="#f0eee6" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">11 steps</text>
<text x="57.6" y="160" fill="#f0eee6" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">opus-5.5 → haiku-4.5</text>
<text x="410.4" y="160" fill="#8b8680" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">100k</text>
<text x="477.6" y="160" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.11</text>
<text x="553.2" y="160" fill="#7fb685" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">+$0.031</text>
<text x="654.0" y="160" fill="#f0eee6" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4 steps</text>
<text x="57.6" y="178" fill="#f0eee6" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sonnet-5.5 → opus-5.5</text>
<text x="418.8" y="178" fill="#8b8680" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">60k</text>
<text x="477.6" y="178" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.15</text>
<text x="553.2" y="178" fill="#c85a54" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">−$0.022</text>
<text x="670.8" y="178" fill="#8b8680" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">never</text>
<text x="57.6" y="196" fill="#f0eee6" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">opus-5.5 → opus-5</text>
<text x="418.8" y="196" fill="#8b8680" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">60k</text>
<text x="477.6" y="196" fill="#c85a54" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$0.36</text>
<text x="553.2" y="196" fill="#c85a54" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">−$0.010</text>
<text x="670.8" y="196" fill="#8b8680" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">never</text>
<text x="57.6" y="232" fill="#8b8680" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⎿ </text>
<text x="74.4" y="232" fill="#8b8680" textLength="630.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">agento never switches the model mid-task: the cache does not carry over, so</text>
<text x="74.4" y="250" fill="#8b8680" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the penalty is a full prefix rewrite. The model is picked at task start,</text>
<text x="74.4" y="268" fill="#8b8680" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">after /clear and in subagents.</text>
</g>
</svg>
